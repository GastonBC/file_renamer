name: Manual Build & Release

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - wasm

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact_name: file_renamer_linux
            asset_path: target/release/file_renamer_rs
            is_wasm: false
          - name: windows
            os: windows-latest
            artifact_name: file_renamer_windows
            asset_path: target/release/file_renamer_rs.exe
            is_wasm: false
          - name: wasm
            os: ubuntu-latest
            artifact_name: file_renamer_wasm
            asset_path: dist
            is_wasm: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.is_wasm && 'wasm32-unknown-unknown' || '' }}

      - name: Install Trunk (WASM bundler)
        if: matrix.is_wasm
        uses: davidB/rust-cargo-make@v1 # or use cargo install
        run: cargo install trunk --locked

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "file_renamer_rs -> target"

      - name: Build Native Release
        if: ${{ !matrix.is_wasm && (inputs.target_platform == 'all' || inputs.target_platform == matrix.name) }}
        run: cargo build --release
        working-directory: ./file_renamer_rs/

      - name: Build WASM Release
        if: ${{ matrix.is_wasm && (inputs.target_platform == 'all' || inputs.target_platform == 'wasm') }}
        run: trunk build --release
        working-directory: ./file_renamer_rs/

      - name: Upload Artifact
        if: ${{ inputs.target_platform == 'all' || inputs.target_platform == matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./file_renamer_rs/${{ matrix.asset_path }}
